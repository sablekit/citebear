name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload document X
        2. Ask "..."
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "citebear.com / self-hosted (commit abc123)"
    validations:
      required: false
