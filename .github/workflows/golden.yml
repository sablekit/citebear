name: Golden retrieval

# The golden sets need live model API keys and cost tokens, so they run only on
# demand and on PRs to main — never in the every-push CI loop (SPEC §9). The
# self-owned set gates every PR; the preloaded-library set (large external PDFs)
# runs on the manual job only.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: golden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    # Skip on PRs that can't see the gateway secret — dependabot and forks get an
    # empty key, so the ingest step would 401 and the check would go red and block
    # the merge. Manual runs and same-repo PRs still run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: citebear
          POSTGRES_PASSWORD: citebear
          POSTGRES_DB: citebear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citebear -d citebear"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://citebear:citebear@localhost:5432/citebear
      GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
      INTERNAL_API_KEY: golden-ci-placeholder # golden hits the pipeline directly, not the HTTP auth
      IP_HASH_SECRET: golden-ci-placeholder
      # golden exercises retrieval, not the admin/upload paths; the ingest CLI
      # still validates all settings at startup, so give it placeholders
      ADMIN_PASSWORD: golden-ci-placeholder
      BLOB_READ_WRITE_TOKEN: golden-ci-placeholder
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - name: Ingest the self-owned corpus
        run: |
          uv run python -m citebear_api.ingest ../../docs/SPEC.md \
            --title "CiteBear Specification" \
            --source-url https://github.com/sablekit/citebear/blob/main/docs/SPEC.md
          uv run python -m citebear_api.ingest ../../README.md \
            --title "CiteBear README" \
            --source-url https://github.com/sablekit/citebear/blob/main/README.md
          uv run python -m citebear_api.ingest ../../AGENTS.md \
            --title "CiteBear Agent & Contributor Context" \
            --source-url https://github.com/sablekit/citebear/blob/main/AGENTS.md
      - run: uv run pytest -m golden tests/golden -q

  # The preloaded library is ~28 MB of external PDFs and re-embeds the whole
  # corpus, so it never gates a PR — only the manual (workflow_dispatch) run,
  # which fetches the library from its canonical URLs and asserts retrieval over
  # the real third-party content (SPEC §11).
  golden-library:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: citebear
          POSTGRES_PASSWORD: citebear
          POSTGRES_DB: citebear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citebear -d citebear"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://citebear:citebear@localhost:5432/citebear
      GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
      INTERNAL_API_KEY: golden-ci-placeholder # golden hits the pipeline directly, not the HTTP auth
      IP_HASH_SECRET: golden-ci-placeholder
      # golden exercises retrieval, not the admin/upload paths; the loader CLI
      # still validates all settings at startup, so give it placeholders
      ADMIN_PASSWORD: golden-ci-placeholder
      BLOB_READ_WRITE_TOKEN: golden-ci-placeholder
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - name: Load the preloaded library
        run: uv run python -m citebear_api.load_library
      - run: uv run pytest -m golden_library tests/golden -q
