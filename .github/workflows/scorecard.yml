name: Scorecard supply-chain security

# OpenSSF Scorecard: audits the repo's security posture (branch protection,
# pinned actions, token permissions, …) and publishes the result so the README
# badge and https://securityscorecards.dev can render it. Runs on the default
# branch only — Scorecard can publish results just from there.
on:
  branch_protection_rule:
  schedule:
    - cron: "27 6 * * 1" # weekly, Monday 06:27 UTC
  push:
    branches: [main]

# Read-all at the top; the analysis job elevates only what it needs.
permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results to the OpenSSF API (badge)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Keep the raw SARIF as an artifact for local inspection.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Surface findings in the repo's Security → Code scanning tab.
      - uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          sarif_file: results.sarif
