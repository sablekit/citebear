name: Post-deploy smoke

# Runs the production smoke check (scripts/smoke.sh) after Vercel reports a
# successful production deploy — Vercel's Git integration posts a GitHub
# deployment_status, which fires this workflow. Catches the class of failure
# where a deploy is "Ready" (built) but dead at runtime (issue #61).
#
# The web and api projects each post their own deployment_status; Vercel names
# the environment "Production – citebear-web" / "Production – citebear-api"
# (not a bare "Production"). We gate on the web project's production success:
# it deploys after the api, so by then the whole chain is live, and it fires
# the check exactly once per merge.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    # Only on the web project's successful production deploy (or a manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment_status.environment, 'Production') &&
       contains(github.event.deployment_status.environment, 'citebear-web'))
    runs-on: ubuntu-latest
    env:
      WEB_URL: https://citebear.com
      API_URL: https://citebear-api.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke-test production
        run: bash scripts/smoke.sh
