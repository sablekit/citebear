# Local development database. Production uses Neon (any Postgres with pgvector works).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: citebear
      POSTGRES_PASSWORD: citebear
      POSTGRES_DB: citebear
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebear -d citebear"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
