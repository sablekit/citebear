[project]
name = "citebear-api"
version = "0.1.0"
description = "CiteBear ingestion/retrieval API - FastAPI + LangChain"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "langchain-text-splitters>=0.3",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "tiktoken>=0.8",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citebear_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# TestClient's httpx types are partially unknown during the httpx->httpx2
# transition; keep src strict, relax only the unknown-type rules in tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
