[project]
name = "citebear-api"
version = "0.1.0"
description = "CiteBear ingestion/retrieval API - FastAPI + LangChain"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",  # fetch uploaded originals from Blob; call the Blob delete API
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "pdfminer-six>=20240706",  # PDF text + per-glyph font size; no pypdfium2/Pillow (bundle size)
    "pgvector>=0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.7",
    "python-docx>=1.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "sse-starlette>=2.1",
    "tiktoken>=0.8",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pyright>=1.1",
    "fpdf2>=2.8",  # generate PDF fixtures with known font sizes for the parser tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citebear_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# TestClient's httpx types are partially unknown during the httpx->httpx2
# transition; keep src strict, relax only the unknown-type rules in tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the golden set needs a live DB + gateway and costs tokens, so it is excluded
# from the every-push run; the golden workflow opts in with `-m golden` (SPEC §9)
addopts = "-m 'not golden'"
markers = ["golden: retrieval golden set; needs a live DB + gateway"]
