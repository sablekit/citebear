<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>CiteBear</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED" />
      <stop offset="1" stop-color="#FBDFAF" />
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C68A4E" />
      <stop offset="1" stop-color="#A96E38" />
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8927A" stop-opacity="0.5" />
      <stop offset="1" stop-color="#E8927A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- decorative citation chips -->
  <g opacity="0.45" font-weight="700" font-size="19" fill="#D97706">
    <g transform="translate(150,120) rotate(-8)"><rect x="-5" y="-20" width="42" height="30" rx="9" fill="#FFFFFF" stroke="#F1C27D" stroke-width="2"/><text x="16" y="1" text-anchor="middle">1</text></g>
    <g transform="translate(1090,150) rotate(7)"><rect x="-5" y="-20" width="42" height="30" rx="9" fill="#FFFFFF" stroke="#F1C27D" stroke-width="2"/><text x="16" y="1" text-anchor="middle">2</text></g>
    <g transform="translate(1070,505) rotate(-5)"><rect x="-5" y="-20" width="42" height="30" rx="9" fill="#FFFFFF" stroke="#F1C27D" stroke-width="2"/><text x="16" y="1" text-anchor="middle">3</text></g>
  </g>

  <!-- ===== scholar bear mascot, centered ===== -->
  <g transform="translate(640,196) scale(1.28)">
    <!-- ears -->
    <circle cx="-62" cy="-78" r="40" fill="url(#fur)" stroke="#8B5A2B" stroke-width="3"/>
    <circle cx="62" cy="-78" r="40" fill="url(#fur)" stroke="#8B5A2B" stroke-width="3"/>
    <circle cx="-62" cy="-78" r="19" fill="#F3DFC1"/>
    <circle cx="62" cy="-78" r="19" fill="#F3DFC1"/>
    <!-- head -->
    <circle cx="0" cy="0" r="100" fill="url(#fur)" stroke="#8B5A2B" stroke-width="3"/>
    <!-- cheeks -->
    <circle cx="-58" cy="34" r="24" fill="url(#cheek)"/>
    <circle cx="58" cy="34" r="24" fill="url(#cheek)"/>
    <!-- muzzle -->
    <ellipse cx="0" cy="36" rx="60" ry="47" fill="#F3DFC1"/>
    <!-- brows: slight inward tilt = focused -->
    <path d="M-49,-31 L-25,-28" fill="none" stroke="#6E4A26" stroke-width="4" stroke-linecap="round"/>
    <path d="M49,-31 L25,-28" fill="none" stroke="#6E4A26" stroke-width="4" stroke-linecap="round"/>
    <!-- eyes cast down at the book: lowered, half-lidded, low highlight -->
    <circle cx="-34" cy="-7" r="9.5" fill="#3A2A1A"/>
    <circle cx="34" cy="-7" r="9.5" fill="#3A2A1A"/>
    <path d="M-43.5,-10 A9.5,9.5 0 0 1 -24.5,-10 Z" fill="#B67C43"/>
    <path d="M24.5,-10 A9.5,9.5 0 0 1 43.5,-10 Z" fill="#B67C43"/>
    <circle cx="-32" cy="-3.5" r="2.6" fill="#FFFFFF"/>
    <circle cx="36" cy="-3.5" r="2.6" fill="#FFFFFF"/>
    <!-- nose -->
    <ellipse cx="0" cy="18" rx="15" ry="11" fill="#3A2A1A"/>
    <!-- composed, level mouth (no grin) -->
    <path d="M0,29 L0,42" fill="none" stroke="#7A5230" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M0,42 C-7,43.5 -13,44 -18,43.5" fill="none" stroke="#7A5230" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M0,42 C7,43.5 13,44 18,43.5" fill="none" stroke="#7A5230" stroke-width="3.4" stroke-linecap="round"/>
    <!-- scholarly round glasses -->
    <g fill="none" stroke="#2E2118" stroke-width="3.6" stroke-linecap="round">
      <circle cx="-34" cy="-9" r="19" fill="#FFFFFF" fill-opacity="0.14"/>
      <circle cx="34" cy="-9" r="19" fill="#FFFFFF" fill-opacity="0.14"/>
      <path d="M-15,-11 Q0,-17 15,-11"/>
      <path d="M-53,-12 L-72,-20"/>
      <path d="M53,-12 L72,-20"/>
    </g>
    <!-- open book, spine as the valley, held in the paws -->
    <g transform="translate(0,116)">
      <path d="M0,4 L-76,-14 L-72,24 L0,26 Z" fill="#B0702C"/>
      <path d="M0,4 L76,-14 L72,24 L0,26 Z" fill="#98601F"/>
      <path d="M0,2 L-68,-10 L-64,18 L0,22 Z" fill="#FBF4E4" stroke="#D9C39B" stroke-width="1.2"/>
      <path d="M0,2 L68,-10 L64,18 L0,22 Z" fill="#FDF8EC" stroke="#D9C39B" stroke-width="1.2"/>
      <path d="M0,2 L0,22" stroke="#C9A66B" stroke-width="1.6"/>
      <g stroke="#C4A877" stroke-width="1.5" stroke-linecap="round">
        <path d="M-58,-1 L-16,4"/>
        <path d="M-56,5 L-16,9"/>
        <path d="M-52,11 L-20,14"/>
        <path d="M16,4 L58,-1"/>
        <path d="M16,9 L56,5"/>
        <path d="M20,14 L52,11"/>
      </g>
      <ellipse cx="-66" cy="16" rx="15" ry="11" fill="url(#fur)" stroke="#8B5A2B" stroke-width="2.5" transform="rotate(-18 -66 16)"/>
      <ellipse cx="66" cy="16" rx="15" ry="11" fill="url(#fur)" stroke="#8B5A2B" stroke-width="2.5" transform="rotate(18 66 16)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="640" y="500" text-anchor="middle" font-size="104" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F172A">Cite</tspan><tspan fill="#D97706">Bear</tspan>
  </text>
  <!-- tagline -->
  <text x="640" y="550" text-anchor="middle" font-size="27" font-weight="600" fill="#475569">
    A source-cited RAG chatbot that never makes things up.
  </text>
  <text x="640" y="590" text-anchor="middle" font-size="19" fill="#78716C">
    Answers cite the exact page · streams like ChatGPT · says
    <tspan font-style="italic" fill="#57534E">“I don’t know”</tspan> instead of guessing.
  </text>
</svg>
